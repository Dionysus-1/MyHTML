<!DOCTYPE html>
<!--

    Aufgabe:

    Erstellen Sie zuerst einen validen html Grundaufbau.  

    a)
    Setzten Sie die benutzte Sprache ihres Dokuments auf deutsch.

    b)
    Erstellen Sie eine <h2> Überschrift mit Bild 1, 2 & 3.
    Fügen Sie unter jede Überschrift das mitgelieferte Testbild ein.
    Vergeben Sie für alle drei Bilder ein alt Attribut mit Text Ihrer Wahl.
    Für Bild 3 vergeben sie im alt Attribut den Text "Kannst Du mich sehen?".
    
    c)
    Vergeben Sie für die ersten zwei Bilder einen funktionierenden Pfad im src Attribut, 
    damit das Bild korrekt angezeigt wird. Beim dritten Bild geben Sie im src Attribut
    einen fehlerhaften Pfad an und schauen was passiert.

    d)
    Vergeben Sie für Bild 1 eine Breite von 100 Pixeln und Bild 2 eine Breite von 200 Pixeln.
    Die Höhe sollte bei beiden auf 100% gesetzt werden.

    e)
    Fügen Sie unter Bild 3 eine h2 mit Bild 4 ein sowie einen <img> tag. Setzten Sie hier die Höhe und Breite auf 100px und schauen Sie was passiert. Danach probieren Sie für beides 100% aus.
        

-->

<html lang="de">
    <head>
        <title>A_1.1_attribute</title>
    </head>
    <body>  
    
        <h2>Bild 1</h2>
        <img src="image.png" alt="Beispielbild 1" width="100" height="100%">

        <h2>Bild 2</h2>
        <img src="image.png" alt="Beispielbild 2" width="200" height="100%">

        <h2>Bild 3</h2>
        <img src="nonexistent.png" alt="Kannst Du mich sehen?" width="200" height="100%">

        <h2>Bild 4</h2>
        <img src="image.png" alt="Beispielbild 4" width="100px" height="100px">
    </body>
