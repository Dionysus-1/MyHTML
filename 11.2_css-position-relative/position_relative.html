<!--

    Aufgabe:

    Positionieren Sie die 5 Icons im Ordner images horizontal mit ihrer
    Bezeichnung (siehe Vorlage). 

    Der gesamte Block, hier in einer <section> hat die Klasse .social-media
    und jeder Icon + Text Block ist in einem <article> gekapselt.

    Vergeben Sie ggf. Klassen für die 5 Einträge
    und images (.svg).

    Sie können die Klassen umbenennen, behalten Sie aber das Grundkonzept bei.

-->

<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Social Media</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h1>Social Media</h1>

    <section class="social-media">
      <article>
        <img class="facebook" src="images/facebook.svg" />
        <p>Facebook</p>
      </article>

      <article>
        <img class="instagram" src="images/instagram.svg" />
        <p>Instagram</p>
      </article>

      <article>
        <img class="linkedin" src="images/linkedin.svg" />
        <p>LinkedIn</p>
      </article>

      <article>
        <img class="xing" src="images/xing.svg" />
        <p>Xing</p>
      </article>

      <article>
        <img class="youtube" src="images/youtube.svg" />
        <p>YouTube</p>
      </article>
    </section>
  </body>
</html>
