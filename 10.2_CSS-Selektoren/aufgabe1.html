<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>UI-Komponenten</title>
    <link rel="stylesheet" href="style-aufgabe1.css" />
  </head>
  <body>
    <h1>UI-Komponenten mit CSS-Klassen</h1>
    <p>Hier siehst du typische Bausteine einer Webseite.</p>

    <!-- Buttons -->
    <button class="btn primaer">Speichern</button>
    <button class="btn sekundaer">Abbrechen</button>
    <button class="btn gefahr">Löschen</button>

    <!-- Hinweisboxen -->
    <div class="hinweis info">Dies ist ein Info-Hinweis.</div>
    <div class="hinweis erfolg">Deine Daten wurden gespeichert.</div>
    <div class="hinweis warnung">Bitte fülle alle Pflichtfelder aus.</div>
    <div class="hinweis fehler">Ein Fehler ist aufgetreten.</div>

    <!-- Badges -->
    <span class="badge neu">Neu</span>
    <span class="badge beliebt">Beliebt</span>
    <span class="badge ausverkauft">Ausverkauft</span>
  </body>
</html>
