<!-- 
    Aufgabe: 

    <ul><li><a>

    Erstellen Sie eine Liste <ul> mit vier Unterpunkten <li>. Innerhalb
    jedes Unterpunkts bitte einen Link <a>. 

    Links wie folgt:

    < a href="Ziel" > Bezeichnung des Links </ a >

    1. Verlinken Sie zu 3 Unterseiten. Home, Kontakt, Impressum. Der vierte
    Link sollte extern sein (target="_blank") und eine Googlesuche öffnen.

    2. Erstellen Sie eine Home (index.html), Kontakt (kontakt.html) und 
    Impressum (impressum.html) Seite und verlinken Sie diese.

    Übertragen Sie die Navigation <ul> in alle Seiten.

-->

<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8"/>
        <title>Links</title>
    </head>
    <body>
        <h1>Landing Page</h1>
        <p>...</p>
        <ul>
            <li><a href="#" style="color: black;">Home</a></li>
            <li><a href="kontakt.html">Kontakt</a></li>
            <li><a href="impressum.html">Impressum</a></li>
            <li><a href="https://www.google.com" target="_blank">Google Suche</a></li>
        </ul>
    </body>
