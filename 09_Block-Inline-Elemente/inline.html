<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inline</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS",
          sans-serif;
      }
      div {
      }
      #rahmen {
        border: 5px dotted pink;
      }
      .border {
        border: 1px solid black !important;
      }
      .is-inline {
        display: inline;
      }
      .is-not-visible {
        display: none;
      }
    </style>
  </head>
  <body>
    <button>Button</button>

    <span class="border is-not-vis-ible">Span 1 Tag</span>
    <button>Button</button>
    <span style="display: block; border: 1px solid black"
      >Span Tag als Block</span
    >

    <div id="rahmen" class="border">Div</div>
    <header class="border is-inline">Header</header>
    <footer class="border is-not-visible">Der Fuß</footer>
  </body>
</html>
